<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Protótipo da identidade visual e da navegação do Balsave.">
  <title>Visão geral · Balsave</title>
  <link rel="icon" href="balsave-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Ir para o conteúdo</a>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="#visao-geral" aria-label="Balsave, visão geral"></a>
      <nav class="desktop-nav" aria-label="Navegação principal"></nav>
      <div class="tools">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Ativar tema escuro"></button>
        <details class="profile">
          <summary class="avatar" aria-label="Minha conta"></summary>
          <div class="profile-links">
            <a href="#acesso">Minha conta</a>
            <a href="#identidade">Identidade visual</a>
          </div>
        </details>
      </div>
    </div>
  </header>
  <main class="shell main" id="content" tabindex="-1"></main>
  <footer class="shell app-footer">
    <span>Protótipo com dados fictícios</span>
    <a href="#identidade">Identidade visual</a>
  </footer>
  <nav class="mobile-nav" aria-label="Navegação principal"></nav>
  <noscript><p class="shell">Ative o JavaScript para navegar pelo protótipo.</p></noscript>
</body>
</html>
