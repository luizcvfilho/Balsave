name: balsave

x-app-db-password: &app-db-password "${BALSAVE_DB_PASSWORD:?Set BALSAVE_DB_PASSWORD in the .env file}"

services:
  proxy:
    image: caddy:2-alpine
    environment:
      BALSAVE_TRUSTED_PROXY_CIDRS: "${BALSAVE_TRUSTED_PROXY_CIDRS:-}"
    ports:
      - "${BALSAVE_BIND_ADDRESS:-127.0.0.1}:${BALSAVE_PORT:-8080}:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BALSAVE_AUTH_SECRET: "${BALSAVE_AUTH_SECRET:-}"
      BALSAVE_BETTER_AUTH_SECRET: "${BALSAVE_BETTER_AUTH_SECRET:-}"
      BALSAVE_IDENTITY_DB_HOST: db
      BALSAVE_IDENTITY_DB_PASSWORD: "${BALSAVE_IDENTITY_DB_PASSWORD:-}"
      BALSAVE_APP_ORIGIN: "${BALSAVE_APP_ORIGIN:-http://localhost:8080}"
      BALSAVE_BACKEND_URL: http://backend:8000
    networks:
      - default
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', { redirect: 'manual' }).then(r => { if (!r.ok && r.status !== 307) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["sh", "-ec", "alembic upgrade head && python -m app.configure_identity_role"]
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}"
      BALSAVE_IDENTITY_DB_PASSWORD: "${BALSAVE_IDENTITY_DB_PASSWORD:-}"
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      BALSAVE_DB_PASSWORD: *app-db-password
      BALSAVE_AUTH_SECRET: "${BALSAVE_AUTH_SECRET:-}"
      PLUGGY_CLIENT_ID: "${PLUGGY_CLIENT_ID:-}"
      PLUGGY_CLIENT_SECRET: "${PLUGGY_CLIENT_SECRET:-}"
    networks:
      - default
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/ready', timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balsave
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}"
      BALSAVE_DB_PASSWORD: *app-db-password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/01-create-app-role.sql:/docker-entrypoint-initdb.d/01-create-app-role.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${BALSAVE_DB_PASSWORD}\" psql -w -h 127.0.0.1 -U balsave_app -d balsave -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  database:
    internal: true

volumes:
  postgres_data:
    name: "${BALSAVE_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_postgres_data}"
